<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SunVibes Health ID</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<meta name="theme-color" content="#123F35">
<link rel="stylesheet" href="fonts.css">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F6F1E7; --surface:#FFFFFF; --surface-2:#EFE7D5;
  --brand-bg:#12213A; --brand-text:#F3EFE3;
  --text:#16233B; --text-soft:#5B6478;
  --accent:#1E6E5C; --accent-strong:#123F35; --accent-soft-bg:#DCEAE2;
  --emergency:#B5222A; --emergency-strong:#8F1B21; --emergency-soft-bg:#F7DBD8;
  --line:#E1D9C6; --focus:#2F7DE1;
  --on-accent:#FFFFFF; --on-brand:#F3EFE3;
  --shadow: 0 1px 2px rgba(18,33,58,.06), 0 8px 24px -12px rgba(18,33,58,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1420; --surface:#161F32; --surface-2:#1E2A42;
    --brand-bg:#0A1220; --brand-text:#F1ECDE;
    --text:#ECE8DC; --text-soft:#A8AFC2;
    --accent:#52C2A2; --accent-strong:#8CDCC4; --accent-soft-bg:rgba(82,194,162,.15);
    --emergency:#FF7A70; --emergency-strong:#FFA39B; --emergency-soft-bg:rgba(255,122,112,.15);
    --line:#2A3552; --focus:#7AACFF;
    --on-accent:#08201A; --on-brand:#F1ECDE;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#161F32; --surface-2:#1E2A42;
  --brand-bg:#0A1220; --brand-text:#F1ECDE;
  --text:#ECE8DC; --text-soft:#A8AFC2;
  --accent:#52C2A2; --accent-strong:#8CDCC4; --accent-soft-bg:rgba(82,194,162,.15);
  --emergency:#FF7A70; --emergency-strong:#FFA39B; --emergency-soft-bg:rgba(255,122,112,.15);
  --line:#2A3552; --focus:#7AACFF;
  --on-accent:#08201A; --on-brand:#F1ECDE;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans JP','Noto Sans KR','Noto Sans Thai',-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{ font-family:'Fraunces','Georgia',serif; text-wrap:balance; }
.mono{ font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }
[dir="rtl"] .lang-pills, [dir="rtl"] .row, [dir="rtl"] .action-grid, [dir="rtl"] .country-grid, [dir="rtl"] .stat-row, [dir="rtl"] .plans-grid, [dir="rtl"] .grid2{ direction:rtl; }
[dir="rtl"] .list-item{ flex-direction:row-reverse; }
[dir="rtl"] .idcard-meta{ flex-direction:row-reverse; }
[dir="rtl"] .chip-remove{ margin-right:4px; }
a{ color:inherit }
button{ font:inherit; color:inherit; }
input,select,textarea{ font:inherit; color:inherit; font-size:16px; }
::selection{ background:var(--accent-soft-bg); }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

/* ============ LAYOUT SHELL ============ */
#root{ min-height:100vh; }
.shell{
  display:grid;
  grid-template-columns: 232px 1fr;
  grid-template-rows: 1fr;
  min-height:100vh;
}
.sidebar{
  background:var(--brand-bg); color:var(--on-brand);
  padding:22px 16px; display:flex; flex-direction:column; gap:28px;
  position:sticky; top:0; height:100vh;
}
.brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
.brand-mark{
  width:34px; height:34px; border-radius:9px; background:var(--accent); overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;
}
.brand-name{ font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; letter-spacing:.01em; line-height:1.15; }
.brand-sub{ font-size:.68rem; color:rgba(243,239,227,.6); letter-spacing:.06em; text-transform:uppercase; margin-top:2px;}
.navgroup{ display:flex; flex-direction:column; gap:2px; }
.navlink{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
  background:transparent; border:none; text-align:left; cursor:pointer; width:100%;
  color:rgba(243,239,227,.72); font-size:.86rem; font-weight:500;
}
.navlink .ic{ width:18px; text-align:center; font-size:1rem; }
.navlink:hover{ background:rgba(243,239,227,.06); color:var(--on-brand); }
.navlink.active{ background:rgba(243,239,227,.1); color:var(--on-brand); }
.navlink.active .ic{ color:var(--accent-strong); }
.sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
.sos-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--emergency); color:#fff; border:none; border-radius:11px;
  padding:13px 12px; font-weight:700; font-size:.86rem; letter-spacing:.02em; cursor:pointer;
  box-shadow:0 6px 18px -6px rgba(181,34,42,.55);
}
.sos-btn:hover{ background:var(--emergency-strong); }
.sidebar-mini{ font-size:.68rem; color:rgba(243,239,227,.45); padding:0 6px; }
.sidebar-mini button{ background:none;border:none;color:rgba(243,239,227,.6); text-decoration:underline; cursor:pointer; padding:0; font-size:.68rem; }

.main{ display:flex; flex-direction:column; min-width:0; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:16px 28px; border-bottom:1px solid var(--line); background:var(--bg);
  position:sticky; top:0; z-index:5;
}
.topbar-title{ font-family:'Fraunces',serif; font-weight:600; font-size:1.3rem; }
.topbar-sub{ color:var(--text-soft); font-size:.82rem; margin-top:1px; }
.lang-pills{ display:flex; flex-wrap:wrap; gap:4px; background:var(--surface-2); padding:3px; border-radius:99px; border:1px solid var(--line); max-width:100%; }
.lang-pill{
  border:none; background:transparent; padding:5px 8px; border-radius:99px; font-size:1.05rem; line-height:1; font-weight:600;
  cursor:pointer; color:var(--text-soft); white-space:nowrap;
}
.lang-pill.active{ background:var(--surface); box-shadow:0 0 0 2px var(--accent) inset; }
.lang-select{
  background:var(--surface-2); border:1px solid var(--line); border-radius:99px;
  padding:8px 14px; font-size:16px; font-weight:600; color:var(--text);
  cursor:pointer; max-width:180px; appearance:auto;
}
@media (max-width:860px){ .lang-select{ max-width:150px; } }
.view{ padding:26px 28px 64px; max-width:920px; }

/* bottom tab bar (narrow) */
.bottombar{ display:none; }

@media (max-width: 860px){
  .shell{ grid-template-columns: 1fr; }
  .sidebar{ display:none; }
  .view{ padding:18px 16px 96px; }
  .topbar{ padding:14px 16px; }
  .bottombar{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--brand-bg); border-top:1px solid rgba(0,0,0,.2);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;
  }
  .bottombar button{
    background:none; border:none; color:rgba(243,239,227,.6); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:.62rem; font-weight:600; cursor:pointer; padding:4px 6px; flex:1;
  }
  .bottombar button .ic{ font-size:1.15rem; }
  .bottombar button.active{ color:var(--on-brand); }
  .bottombar button.active .ic{ color:var(--accent-strong); }
  .bottombar button.emergency{ color:var(--emergency); }
  .bottombar button.emergency .ic{ color:var(--emergency); }
}

/* ============ COMPONENTS ============ */
.eyebrow{ font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow); }
.card + .card{ margin-top:16px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px;}
.section-head h2{ font-size:1.02rem; margin:0; font-weight:600; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:560px){ .grid2{ grid-template-columns:1fr; } }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:.74rem; font-weight:600; color:var(--text-soft); }
.field input[type=text], .field input[type=tel], .field input[type=number], .field select, .field textarea{
  background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:10px 12px;
  font-size:1rem; color:var(--text); width:100%;
}
.field textarea{ resize:vertical; min-height:64px; }
.hint{ font-size:.72rem; color:var(--text-soft); }
.row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  border-radius:10px; padding:10px 16px; font-size:.86rem; font-weight:600; border:1px solid transparent;
}
.btn-primary{ background:var(--accent); color:var(--on-accent); }
.btn-primary:hover{ background:var(--accent-strong); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--text); }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-emergency{ background:var(--emergency); color:#fff; }
.btn-emergency:hover{ background:var(--emergency-strong); }
.btn-sm{ padding:6px 11px; font-size:.76rem; border-radius:8px; }
.btn-block{ width:100%; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:99px;
  background:var(--surface-2); border:1px solid var(--line); font-size:.8rem; cursor:pointer; color:var(--text);
}
.chip.selected{ background:var(--accent-soft-bg); border-color:var(--accent); color:var(--accent-strong); font-weight:600; }
.chip-remove{ background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:.9em;opacity:.7; }
.badge{ display:inline-flex; align-items:center; gap:5px; font-size:.66rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:3px 8px; border-radius:99px; background:var(--accent-soft-bg); color:var(--accent-strong); }
.badge-warn{ background:var(--emergency-soft-bg); color:var(--emergency-strong); }
.stamp{ font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-soft); border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
.empty{ text-align:center; padding:36px 20px; color:var(--text-soft); }
.empty .ic{ font-size:1.8rem; margin-bottom:8px; }
.disclaimer{ font-size:.74rem; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 13px; line-height:1.5; }
.list-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-top:1px solid var(--line); }
.list-item:first-child{ border-top:none; }
.saved-flag{ font-size:.72rem; color:var(--accent); font-weight:600; opacity:0; transition:opacity .3s; }
.saved-flag.show{ opacity:1; }

/* ID card */
.idcard{
  background:linear-gradient(155deg, var(--brand-bg), #1B3358 65%, var(--accent-strong));
  color:var(--on-brand); border-radius:18px; padding:24px; position:relative; overflow:hidden;
}
.idcard::after{ content:""; position:absolute; inset:0; background:radial-gradient(420px 220px at 100% 0%, rgba(255,255,255,.08), transparent 70%); pointer-events:none;}
.idcard-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.idcard-brand{ font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
.idcard-flag{ font-size:1.4rem; }
.idcard-name{ font-family:'Fraunces',serif; font-size:1.5rem; font-weight:600; margin-top:16px; }
.idcard-id{ font-family:'IBM Plex Mono',monospace; font-size:.74rem; opacity:.65; margin-top:2px; letter-spacing:.03em;}
.idcard-meta{ display:flex; gap:26px; margin-top:20px; }
.idcard-meta div div:first-child{ font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; opacity:.6; }
.idcard-meta div div:last-child{ font-family:'IBM Plex Mono',monospace; font-size:1.05rem; margin-top:2px; }

.progress-track{ height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); border-radius:99px; }
.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.stat-box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; }
.stat-num{ font-family:'Fraunces',serif; font-size:1.5rem; font-weight:600; }
.stat-label{ font-size:.7rem; color:var(--text-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
@media (max-width:560px){ .stat-row{ grid-template-columns:1fr 1fr; } }

/* Country grid */
.country-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.country-card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px;
  display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left;
}
.country-card:hover{ border-color:var(--accent); }
.country-card.active{ border-color:var(--accent); background:var(--accent-soft-bg); }
.country-card .flag{ font-size:1.5rem; }
.country-card .name{ font-weight:600; font-size:.86rem; }
.country-card .code{ font-size:.68rem; color:var(--text-soft); }

.action-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media (max-width:560px){ .action-grid{ grid-template-columns:repeat(2,1fr); } }
.action-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; cursor:pointer; text-align:center;
}
.action-btn:hover{ border-color:var(--accent); }
.action-btn .ic{ font-size:1.3rem; }
.action-btn .lbl{ font-size:.74rem; font-weight:600; }
.action-btn.emergency{ background:var(--emergency-soft-bg); border-color:var(--emergency); }
.action-btn.emergency .lbl{ color:var(--emergency-strong); }

/* Plans */
.plans-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:640px){ .plans-grid{ grid-template-columns:1fr; } }
.plan-card{ border:1px solid var(--line); border-radius:16px; padding:22px; background:var(--surface); }
.plan-card.pro{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft-bg); }
.plan-price{ font-family:'Fraunces',serif; font-size:2rem; font-weight:600; margin:6px 0 2px; }
.plan-list{ list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:9px; }
.plan-list li{ display:flex; gap:8px; font-size:.84rem; align-items:flex-start; }
.plan-list li::before{ content:"✓"; color:var(--accent); font-weight:700; flex:none; }

/* ============ EMERGENCY (fixed theme, always legible) ============ */
.emergency-screen{
  position:fixed; inset:0; z-index:100; background:#FFFFFF; color:#1A1A1A; overflow-y:auto;
  font-family:'Noto Sans','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans JP','Noto Sans KR','Noto Sans Thai',sans-serif;
}
.emergency-topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:3px solid var(--emergency); }
.emergency-close{ background:none;border:1px solid #ccc;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.8rem;color:#1A1A1A; }
.emergency-langs{ display:flex; flex-wrap:wrap; gap:6px; max-width:60%; justify-content:flex-end; }
.emergency-langs button{ border:2px solid var(--emergency); background:#fff; color:var(--emergency); font-weight:700; border-radius:8px; padding:4px 8px; font-size:1.05rem; line-height:1; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:2px; }
.emergency-langs button.active{ background:#fff; box-shadow:0 0 0 3px var(--emergency) inset; }
.emergency-langs button.locked{ opacity:.55; border-style:dashed; }
.emergency-langs .lockdot{ font-size:.68rem; }
.emergency-planhint{ margin:0; padding:8px 18px; background:#fff4f4; border-bottom:1px solid var(--emergency); color:#7a1f1f; font-size:.76rem; text-align:right; }
.emergency-planhint a{ color:#7a1f1f; font-weight:700; text-decoration:underline; }
.emergency-members{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:10px 18px; border-bottom:1px solid var(--line); }
.member-pill{ border:1px solid var(--emergency); background:#fff; color:var(--emergency); font-weight:600; border-radius:99px; padding:4px 12px; font-size:.76rem; cursor:pointer; }
.member-pill.active{ background:var(--emergency); color:#fff; }
.emergency-body{ padding:20px 20px 60px; max-width:640px; margin:0 auto; }
.emergency-name{ font-family:'Fraunces',serif; font-size:2rem; font-weight:700; }
.emergency-flagrow{ display:flex; align-items:center; gap:8px; color:#555; font-size:.92rem; margin-top:4px; }
.ealert{ background:var(--emergency); color:#fff; border-radius:12px; padding:16px 18px; margin-top:18px; }
.ealert .k{ font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; opacity:.85; }
.ealert .v{ font-family:'Fraunces',serif; font-size:1.7rem; font-weight:700; margin-top:2px; }
.eblock{ margin-top:16px; border:1.5px solid #c2c2c2; border-radius:12px; padding:15px 17px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.eblock .k{ font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:#8a8a8a; font-weight:700; }
.eblock .v{ font-size:1.05rem; margin-top:5px; line-height:1.5; }
.eblock .v.empty{ color:#aaa; font-style:italic; }
.etag{ display:inline-block; background:#FBEAEA; color:var(--emergency-strong,#8F1B21); border-radius:99px; padding:4px 10px; font-size:.82rem; font-weight:600; margin:3px 6px 0 0; }
.ecall{ display:inline-flex; align-items:center; gap:8px; background:var(--emergency); color:#fff; border-radius:10px; padding:11px 16px; font-weight:700; text-decoration:none; margin-top:8px; font-size:.9rem; }
.qr-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:22px; padding:18px; border:1px dashed #ccc; border-radius:12px; }
.qr-wrap #qrcanvas{ background:#fff; padding:8px; border-radius:8px; }
.print-actions{ display:flex; justify-content:center; margin-top:18px; }
.print-actions .btn{ border:1px solid #ccc; background:#fff; color:#1A1A1A; }
.print-footer{ display:none; }

/* Print / export as PDF — only .emergency-screen content is visible, one clean page */
@media print{
  html, body{ background:#fff !important; }
  body *{ visibility:hidden; }
  .emergency-screen, .emergency-screen *{ visibility:visible; }
  .emergency-screen{ position:absolute; top:0; left:0; right:0; bottom:auto; height:auto; overflow:visible; background:#fff; }
  .no-print{ display:none !important; }
  .emergency-body{ max-width:100%; padding:0 8px; }
  .eblock{ break-inside:avoid; }
  .ealert{ break-inside:avoid; }
  .print-footer{ display:block; margin-top:16px; padding-top:10px; border-top:1px solid #ccc; font-size:.72rem; color:#666; }
}

/* Toast */
#toast{ position:fixed; bottom:18px; left:50%; transform:translate(-50%,12px); background:var(--brand-bg); color:var(--on-brand); padding:10px 18px; border-radius:99px; font-size:.82rem; opacity:0; pointer-events:none; transition:all .25s; z-index:200; box-shadow:var(--shadow); }
#toast.show{ opacity:1; transform:translate(-50%,0); }
</style>

const STORAGE_KEY = 'ghid_prototype_v1';
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function blankProfile(){
  return {
    id: uid('SVH'), name:'', nationality:'IT', bloodType:'',
    allergies:[], allergiesCustom:[], conditions:[], conditionsCustom:[],
    medications:[], medicationsCustom:[], surgeries:[],
    emergencyContact:{ name:'', relationship:'', phone:'' },
    emergencyContactsExtra:[], emergencyNotes:'',
    insurance:{ company:'', policy:'', phone:'' },
    insuranceWallet:[],
    familyMembers:[],
    documents:[],
  };
}
function blankFamDraft(){
  // Scratch state for the "add family member" form — mirrors the controlled-vocabulary
  // shape of the main profile (allergies/conditions/medications + a Custom list for
  // anything outside VOCAB), so family members get the same verified-translation
  // treatment as the user's own profile instead of a single free-text field (v5.19).
  // Also holds the plain fields (name, relationship, ...): every chip click re-renders
  // the whole card, so those fields must live in state too, or they'd be wiped on every
  // click instead of surviving like the rest of the form. Default relationship is the
  // literal first RELATIONSHIPS value (not RELATIONSHIPS[0]) because this runs before
  // that const is declared further down the script.
  return { name:'', relationship:'relSpouse', bloodType:'', contactName:'', contactPhone:'', allergies:[], allergiesCustom:[], conditions:[], conditionsCustom:[], medications:[], medicationsCustom:[] };
}

const MAX_FREE_DOCS = 5;
function isPro(){ return state.ui.plan === 'pro'; }
/* Languages available on the Free plan for a given "viewer" context: the user's own
   app language plus English as universal medical bridge language. Everything else
   (the doctor's native language) is a PRO feature. */
function freeLangsFor(lang){ return Array.from(new Set([lang, 'en'])); }
function isLangFree(lang, baseLang){ return isPro() || freeLangsFor(baseLang).includes(lang); }
function migrateLegacyMedications(p){
  // Pre-v5.7 profiles stored medications as free-text {name, dosage}. New shape uses a
  // controlled vocabulary {key, dosage} + a separate medicationsCustom list for anything
  // not in VOCAB.medications. Move any legacy free-text entries over on load so old saved
  // profiles don't break and don't silently lose data.
  if(!Array.isArray(p.medications)) { p.medications = []; }
  if(!Array.isArray(p.medicationsCustom)) { p.medicationsCustom = []; }
  const kept = [];
  p.medications.forEach(m=>{
    if(m && typeof m === 'object' && !('key' in m) && 'name' in m){
      p.medicationsCustom.push({ id: uid('MED'), text: m.name, dosage: m.dosage || '' });
    } else if(m && m.key){
      kept.push(m);
    }
  });
  p.medications = kept;
}
function migrateLegacyFamilyMembers(p){
  // Pre-v5.19 profiles stored each family member's allergies/conditions/medications as a
  // single free-text field (allergiesText/conditionsText/medicationsText). New shape
  // mirrors the main profile: a controlled-vocabulary array + a separate Custom array.
  // Move any legacy text over into the Custom list on load so old saved profiles don't
  // break and don't silently lose data.
  if(!Array.isArray(p.familyMembers)) { p.familyMembers = []; }
  p.familyMembers.forEach(f=>{
    if(!Array.isArray(f.allergies)){
      f.allergies = [];
      f.allergiesCustom = f.allergiesText ? [{ id: uid('AL'), text: f.allergiesText }] : [];
    }
    if(!Array.isArray(f.conditions)){
      f.conditions = [];
      f.conditionsCustom = f.conditionsText ? [{ id: uid('CD'), text: f.conditionsText }] : [];
    }
    if(!Array.isArray(f.medications)){
      f.medications = [];
      f.medicationsCustom = f.medicationsText ? [{ id: uid('MED'), text: f.medicationsText, dosage: '' }] : [];
    }
    delete f.allergiesText; delete f.conditionsText; delete f.medicationsText;
  });
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.profile = parsed.profile ? Object.assign(blankProfile(), parsed.profile) : null;
      if(state.profile) { migrateLegacyMedications(state.profile); migrateLegacyFamilyMembers(state.profile); }
      state.ui.plan = parsed.plan || 'free';
      state.ui.lang = parsed.lang || 'it';
      state.ui.travelCountry = parsed.travelCountry || null;
      if(state.profile) state.ui.view = 'home';
    }
  }catch(e){ /* storage unavailable — continue with in-memory defaults */ }
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile: state.profile, lang: state.ui.lang, travelCountry: state.ui.travelCountry, plan: state.ui.plan }));
  }catch(e){ /* best effort only */ }
}

}

function flashSaved(){
  const flag = document.getElementById('save-flag');
  if(!flag) return;
  flag.classList.add('show');

  flag._t = setTimeout(()=>flag.classList.remove('show'), 1200);
}
function bindText(id, setter){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{ setter(el.value); persist(); flashSaved(); });
}
function bindDraftText(id, setter){
  // Same idea as bindText, but for scratch/draft state (e.g. the "add family member"
  // form) that isn't part of the saved profile yet — updates the value on every
  // keystroke so it survives the re-renders triggered by chip clicks, without persisting
  // to storage or flashing the "saved" indicator for something not saved yet (v5.19).
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{ setter(el.value); });
}

function bindProfile(){
  const p = state.profile;
  const bt = document.getElementById('p-bloodtype');
  bt.addEventListener('change', ()=>{ p.bloodType = bt.value; persist(); flashSaved(); });

  document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', ()=>{
    const listName = b.dataset.toggle, id = b.dataset.id;
    const arr = p[listName];
    const i = arr.indexOf(id);
    if(i>=0) arr.splice(i,1); else arr.push(id);
    persist(); render();
  }));
  document.querySelectorAll('[data-removecustom]').forEach(b=>b.addEventListener('click', ()=>{
    const listName = b.dataset.removecustom, cid = b.dataset.cid;
    p[listName] = p[listName].filter(c=>c.id!==cid);
    persist(); render();
  }));
  document.getElementById('p-allergy-add').addEventListener('click', ()=>{
    const el = document.getElementById('p-allergy-custom'); const val = el.value.trim();
    if(!val) return; p.allergiesCustom.push({id:uid('AL'), text:val}); persist(); render();
  });
  document.getElementById('p-condition-add').addEventListener('click', ()=>{
    const el = document.getElementById('p-condition-custom'); const val = el.value.trim();
    if(!val) return; p.conditionsCustom.push({id:uid('CD'), text:val}); persist(); render();
  });
  const medSelect = document.getElementById('p-med-select');
  const medCustomInput = document.getElementById('p-med-custom-name');
  if(medSelect) medSelect.addEventListener('change', ()=>{
    medCustomInput.style.display = medSelect.value === '__custom__' ? '' : 'none';
  });
  document.getElementById('p-med-add').addEventListener('click', ()=>{
    const dosage = document.getElementById('p-med-dosage').value.trim();
    const selVal = medSelect.value;
    if(selVal === '__custom__'){
      const text = medCustomInput.value.trim();
      if(!text) return;
      p.medicationsCustom.push({ id: uid('MED'), text, dosage });
    } else {
      if(!selVal) return;
      p.medications.push({ key: selVal, dosage });
    }
    persist(); render();
  });
  document.querySelectorAll('[data-rm-med]').forEach(b=>b.addEventListener('click', ()=>{ p.medications.splice(+b.dataset.rmMed,1); persist(); render(); }));
  document.querySelectorAll('[data-rm-medcustom]').forEach(b=>b.addEventListener('click', ()=>{ p.medicationsCustom = p.medicationsCustom.filter(m=>m.id!==b.dataset.rmMedcustom); persist(); render(); }));
  document.getElementById('p-surg-add').addEventListener('click', ()=>{
    const desc = document.getElementById('p-surg-desc').value.trim();
    const year = document.getElementById('p-surg-year').value.trim();
    if(!desc) return; p.surgeries.push({desc, year}); persist(); render();
  });
  document.querySelectorAll('[data-rm-surg]').forEach(b=>b.addEventListener('click', ()=>{ p.surgeries.splice(+b.dataset.rmSurg,1); persist(); render(); }));

  bindText('p-ec-name', v=>p.emergencyContact.name=v);
  document.getElementById('p-ec-rel').addEventListener('change', e=>{ p.emergencyContact.relationship = e.target.value; persist(); flashSaved(); });
  bindText('p-ec-phone', v=>p.emergencyContact.phone=v);
  bindText('p-ins-company', v=>p.insurance.company=v);
  bindText('p-ins-policy', v=>p.insurance.policy=v);
  bindText('p-ins-phone', v=>p.insurance.phone=v);

  /* Advanced emergency profile (PRO) */
  bindText('p-emg-notes', v=>p.emergencyNotes=v);
  const ec2Add = document.getElementById('ec2-add');
  if(ec2Add) ec2Add.addEventListener('click', ()=>{
    const name = document.getElementById('ec2-name').value.trim();
    const relationship = document.getElementById('ec2-rel').value;
    const phone = document.getElementById('ec2-phone').value.trim();
    if(!name || !phone) return;
    p.emergencyContactsExtra.push({ name, relationship, phone });
    persist(); render();
  });
  document.querySelectorAll('[data-rm-ec]').forEach(b=>b.addEventListener('click', ()=>{
    p.emergencyContactsExtra.splice(+b.dataset.rmEc,1); persist(); render();
  }));

  /* Insurance wallet (PRO) */
  const iwAdd = document.getElementById('iw-add');
  if(iwAdd) iwAdd.addEventListener('click', ()=>{
    const company = document.getElementById('iw-company').value.trim();
    if(!company) return;
    const type = document.getElementById('iw-type').value.trim();
    const policy = document.getElementById('iw-policy').value.trim();
    const phone = document.getElementById('iw-phone').value.trim();
    const validUntil = document.getElementById('iw-valid').value.trim();
    p.insuranceWallet.push({ company, type, policy, phone, validUntil });
    persist(); render();
  });
  document.querySelectorAll('[data-rm-ins]').forEach(b=>b.addEventListener('click', ()=>{
    p.insuranceWallet.splice(+b.dataset.rmIns,1); persist(); render();
  }));

  /* Family profiles (PRO) — vocabolario controllato sul draft (v5.19), stesso pattern
     dei picker allergie/patologie/farmaci del profilo principale, ma su state.ui.famDraft
     finché il nuovo familiare non viene aggiunto (nessun persist() finché non si conferma). */

  bindDraftText('fam-contact-phone', v=>fd.contactPhone=v);
  const famRelSelect = document.getElementById('fam-rel');

  document.querySelectorAll('[data-fam-toggle]').forEach(b=>b.addEventListener('click', ()=>{

  document.querySelectorAll('[data-fam-removecustom]').forEach(b=>b.addEventListener('click', ()=>{

    if(!val) return; fd.conditionsCustom.push({id:uid('CD'), text:val}); render();

function bindDocuments(){

  const guideHide = document.getElementById('doc-guide-hide');

  const uploadBtn = document.getElementById('doc-upload-btn');
  if(uploadBtn) uploadBtn.addEventListener('click', ()=>document.getElementById('doc-file-input').click());
  document.getElementById('doc-file-input').addEventListener('change', (e)=>{
    const files = Array.from(e.target.files || []);
    let pending = files.length;
    if(!pending) return;
    let room = isPro() ? Infinity : Math.max(0, MAX_FREE_DOCS - p.documents.length);
    files.forEach(file=>{
      if(room <= 0){ pending--; if(pending===0){ persist(); render(); toast('🔒 '+t('docLimitMsg')); } return; }
      room--;
      const entry = { id: uid('DOC'), name:file.name, size:file.size, type:file.type, date:new Date().toLocaleDateString(state.ui.lang) };
      const finish = ()=>{ p.documents.push(entry); pending--; if(pending===0){ state.ui.docGuideOpen = false; persist(); render(); } };
      if(file.type.startsWith('image/') && file.size < 1.5*1024*1024){
        const reader = new FileReader();
        reader.onload = ()=>{ entry.thumb = reader.result; finish(); };
        reader.onerror = finish;
        reader.readAsDataURL(file);
      } else { finish(); }
    });
  });
  document.querySelectorAll('[data-rm-doc]').forEach(b=>b.addEventListener('click', ()=>{
    p.documents = p.documents.filter(d=>d.id!==b.dataset.rmDoc); persist(); render();
  }));

    if(f.key==='medication') p.medicationsCustom.push({id:uid('MED'), text:f.name, dosage:f.dosage});
    state.ui.extractedApplied = [...(state.ui.extractedApplied||[]), i];
    persist(); render(); toast(t('addedToProfileToast'));
  }));
}

async function exportProfileFile(){
  const payload = { schema:'ghid-backup-v1', exportedAt:new Date().toISOString(), profile:state.profile, lang:state.ui.lang, travelCountry:state.ui.travelCountry, plan:state.ui.plan };
  const jsonStr = JSON.stringify(payload, null, 2);
  const safeName = (state.profile.name||'profile').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'profile';
  const filename = `sunvibes-health-id-${safeName}-${new Date().toISOString().slice(0,10)}.json`;
  // In the hosted Claude artifact viewer, page-initiated downloads are sandboxed and silently
  // do nothing — the `downloads` capability is the supported way to hand the viewer a file there.
  // Outside that viewer (e.g. a future real deployment as a plain website) that capability doesn't
  // exist, so we fall back to a classic <a download> blob link, which works in a normal browser.
  let downloadsApi = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      downloadsApi = await window.claude.use('downloads');
    }
  }catch(e){ downloadsApi = null; }
  if(downloadsApi){
    try{ await downloadsApi.save({ filename, data: jsonStr }); return; }
    catch(err){ if(err && err.code === 'declined') return; /* otherwise fall through to classic download */ }
  }
  const blob = new Blob([jsonStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

    `${I18N[lang].medications}: ${medText}`,
    `${I18N[lang].surgeries}: ${surgText}`,
    `${I18N[lang].emergencyContact}: ${p.emergencyContact.name||'-'} (${p.emergencyContact.phone||'-'})`,
    `${I18N[lang].insurance}: ${p.insurance.company||'-'} / ${p.insurance.policy||'-'} / ${p.insurance.phone||'-'}`,
  ];
  if(p.emergencyContactsExtra && p.emergencyContactsExtra.length){
    lines.push(`${I18N[lang].extraContacts}: ` + p.emergencyContactsExtra.map(c=>`${c.name} (${c.phone})`).join('; '));
  }
  if(p.emergencyNotes){
    lines.push(`${I18N[lang].emergencyNotesLabel}: ${p.emergencyNotes}`);
  }
  return lines.join('\n');
}
function truncateToBytes(str, maxBytes){
  const enc = new TextEncoder();
  if(enc.encode(str).length <= maxBytes) return str;
  let lo = 0, hi = str.length;
  while(lo < hi){
    const mid = Math.ceil((lo+hi)/2);
    if(enc.encode(str.slice(0,mid)).length <= maxBytes) lo = mid; else hi = mid-1;
  }
  return str.slice(0, lo);
}
/* Condensed, QR-capacity-safe version of the emergency summary: a full profile
   (many allergies/conditions/meds/notes) can easily exceed what a QR code can
   physically hold (byte-mode caps out around ~2.9KB even at the lowest error
   correction / max size) — and dense codes above ~1KB get hard to scan with a
   phone camera anyway. This keeps only the fields a first responder needs most
   and hard-caps the byte length so QR generation never throws. */
function buildEmergencyQrSummary(lang){
  const p = emergencySubject();
  const allergyText = [...p.allergies.map(id=>vocabLabel('allergies',id,lang)), ...p.allergiesCustom.map(c=>c.text)].join('; ') || (I18N[lang].noAllergies);
  const condText = [...p.conditions.map(id=>vocabLabel('conditions',id,lang)), ...p.conditionsCustom.map(c=>c.text)].join('; ') || I18N[lang].none;
  const medText = [...p.medications.map(m=>`${vocabLabel('medications',m.key,lang)} (${m.dosage||'-'})`), ...p.medicationsCustom.map(m=>`${m.text} (${m.dosage||'-'})`)].join('; ') || I18N[lang].none;
  const lines = [
    `GLOBAL HEALTH ID`,
    `${I18N[lang].name}: ${p.name}`,
    `${I18N[lang].bloodType}: ${p.bloodType||'-'}`,
    `${I18N[lang].allergies}: ${allergyText}`,
    `${I18N[lang].conditions}: ${condText}`,
    `${I18N[lang].medications}: ${medText}`,
    `${I18N[lang].emergencyContact}: ${p.emergencyContact.name||'-'} (${p.emergencyContact.phone||'-'})`,
  ];
  const MAX_BYTES = 700;
  let text = lines.join('\n');
  if(new TextEncoder().encode(text).length > MAX_BYTES){
    text = truncateToBytes(text, MAX_BYTES - 1) + '…';
  }
  return text;
}

function bindEmergency(){
  document.getElementById('e-close').addEventListener('click', closeEmergency);
  document.querySelectorAll('[data-elang]').forEach(b=>b.addEventListener('click', ()=>{
    const l = b.dataset.elang;
    if(!isLangFree(l, state.ui.lang)){ toast('🔒 '+tE('proLockMsg')); return; }
    state.ui.emergencyLang = l; render();
  }));
  const viewPro = document.getElementById('e-view-pro');
  if(viewPro) viewPro.addEventListener('click', (e)=>{ e.preventDefault(); closeEmergency(); go('plans'); });
  document.querySelectorAll('[data-emember]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.emergencyMemberId = b.dataset.emember || null; render();
  }));
  const genBtn = document.getElementById('e-genqr');
  const genQr = ()=>{
    const box = document.getElementById('qrcanvas');
    if(!box) return false;
    box.innerHTML = '';
    if(typeof QRCode === 'undefined'){ box.innerHTML = `<div class="hint">⚠️ ${esc(tE('qrUnavailable'))}</div>`; return false; }
    try{
      new QRCode(box, { text: buildEmergencyQrSummary(state.ui.emergencyLang), width:176, height:176, correctLevel: QRCode.CorrectLevel.L });
      return true;
    }catch(err){
      box.innerHTML = `<div class="hint">⚠️ ${esc(tE('qrUnavailable'))}</div>`;
      return false;
    }
  };
  if(genBtn) genBtn.addEventListener('click', genQr);
  const printBtn = document.getElementById('e-print');
  if(printBtn) printBtn.addEventListener('click', ()=>{
    const box = document.getElementById('qrcanvas');
    if(box && !box.hasChildNodes()) genQr();
    exportEmergencyPdf();
  });
}
async function exportEmergencyPdf(){
  const lang = state.ui.emergencyLang;
  const p = emergencySubject();
  const country = COUNTRIES.find(c=>c.code===p.nationality);
  const safeName = (p.name||'id').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'id';
  const filename = `sunvibes-health-id-emergency-${safeName}-${lang}.pdf`;

  const allergyItems = [...p.allergies.map(id=>vocabLabel('allergies',id,lang)), ...p.allergiesCustom.map(c=>c.text)];
  const condItems = [...p.conditions.map(id=>vocabLabel('conditions',id,lang)), ...p.conditionsCustom.map(c=>c.text)];
  const medItems = [...p.medications.map(m=>`${vocabLabel('medications',m.key,lang)} (${m.dosage||'-'})`), ...p.medicationsCustom.map(m=>`${m.text} (${m.dosage||'-'})`)];
  const surgItems = p.surgeries.map(s=>`${s.desc} (${s.year||'-'})`);
  const extraContactItems = (p.emergencyContactsExtra||[]).map(c=>`${c.name} — ${c.phone}`);

  let pdfBlob = null;
  try{
    if(window.jspdf && window.jspdf.jsPDF){
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'pt', format:'a4' });
      const margin = 40, maxWidth = 515, pageBottom = 780;
      let y = margin;

      const ensureSpace = (needed)=>{ if(y + needed > pageBottom){ doc.addPage(); y = margin; } };
      const addLabelValue = (label, value, size)=>{
        doc.setFont('helvetica','bold'); doc.setFontSize(size||11); doc.setTextColor(20,20,20);
        const labelText = `${label}: `;
        const labelWidth = doc.getTextWidth(labelText);
        const valueLines = doc.splitTextToSize(value||'—', maxWidth - labelWidth);
        ensureSpace(16 * valueLines.length);
        doc.text(labelText, margin, y);
        doc.setFont('helvetica','normal');
        doc.text(valueLines[0]||'', margin + labelWidth, y); y += 16;
        for(let i=1;i<valueLines.length;i++){ ensureSpace(16); doc.text(valueLines[i], margin, y); y += 16; }
      };
      const addSectionHeading = (text)=>{
        ensureSpace(20); y += 4;
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(90,90,90);
        doc.text(String(text).toUpperCase(), margin, y); y += 14;
      };
      const addBulletList = (items, emptyText)=>{
        doc.setFontSize(11);
        if(!items.length){
          ensureSpace(16);
          doc.setFont('helvetica','normal'); doc.setTextColor(120,120,120);
          doc.text(emptyText, margin + 14, y); y += 16;
          return;
        }
        items.forEach(item=>{
          const lines = doc.splitTextToSize(item, maxWidth - 14);
          ensureSpace(16 * lines.length);
          doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
          doc.text('•', margin, y);
          doc.text(lines[0]||'', margin + 14, y); y += 16;
          for(let i=1;i<lines.length;i++){ ensureSpace(16); doc.text(lines[i], margin + 14, y); y += 16; }
        });
      };

      // Header
      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(20,20,20);
      doc.text('GLOBAL HEALTH ID', margin, y); y += 22;
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120,120,120);
      doc.text(`${tE('printedOn')} ${new Date().toLocaleString(lang)}`, margin, y); y += 20;

      // Name / nationality / member id
      doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(20,20,20);
      doc.text(p.name || '—', margin, y); y += 18;
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(100,100,100);
      doc.text(`${country ? (country.name[lang]||country.name.en) : ''}${p.id ? '   '+p.id : ''}`, margin, y); y += 20;

      // Blood type — highlighted, matches the on-screen alert card
      addLabelValue(I18N[lang].bloodType, p.bloodType || '—', 13);
      y += 6;

      addSectionHeading(I18N[lang].allergies);
      addBulletList(allergyItems, I18N[lang].noAllergies);

      addSectionHeading(I18N[lang].medications);
      addBulletList(medItems, I18N[lang].none);

      addSectionHeading(I18N[lang].conditions);
      addBulletList(condItems, I18N[lang].none);

      addSectionHeading(I18N[lang].surgeries);
      addBulletList(surgItems, I18N[lang].none);

      y += 6;
      addLabelValue(I18N[lang].emergencyContact, `${p.emergencyContact.name||'-'} (${p.emergencyContact.phone||'-'})`);
      if(extraContactItems.length){
        addSectionHeading(I18N[lang].extraContacts);
        addBulletList(extraContactItems, I18N[lang].none);
      }
      addLabelValue(I18N[lang].insurance, `${p.insurance.company||'-'} / ${p.insurance.policy||'-'} / ${p.insurance.phone||'-'}`);

      if(p.emergencyNotes){
        addSectionHeading(I18N[lang].emergencyNotesLabel);
        doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(20,20,20);
        doc.splitTextToSize(p.emergencyNotes, maxWidth).forEach(w=>{ ensureSpace(16); doc.text(w, margin, y); y += 16; });
      }

      pdfBlob = doc.output('blob');
    }
  }catch(err){ pdfBlob = null; }

  if(!pdfBlob){
    // jsPDF unavailable or failed to build the file — fall back to the browser's native print dialog
    window.print();
    return;
  }

  let downloadsApi = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      downloadsApi = await window.claude.use('downloads');
    }
  }catch(e){ downloadsApi = null; }
  if(downloadsApi){
    try{ await downloadsApi.save({ filename, data: pdfBlob }); return; }
    catch(err){ if(err && err.code === 'declined') return; /* otherwise fall through to classic download */ }
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function bootstrap(){
  try{
    const [i18nData, travelData] = await Promise.all([
      fetch('i18n.json').then(r=>r.json()),
      fetch('travel-data.json').then(r=>r.json())
    ]);
    I18N = i18nData;
    COUNTRIES = travelData;
  }catch(e){
    console.error('Errore nel caricamento dei dati', e);
    document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;">Errore nel caricamento dei dati. Ricarica la pagina.</div>';
    return;
  }
  init();
}
document.addEventListener('DOMContentLoaded', bootstrap);
